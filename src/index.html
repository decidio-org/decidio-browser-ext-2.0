<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decidio Unified Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Sidebar Panel -->
    <div class="decidio-sidebar is-collapsed" id="decidioSidebarPanel">
        
        <!-- Header Section -->
        <div class="sidebar-header">
            <div class="brand-logo">decidio<span class="blue-dot">.</span></div>
        </div>

        <!-- Main Body Content -->
        <div class="sidebar-body">
            
            <!-- LIST DROPDOWN -->
            <div class="form-group">
                <label class="form-label">Lists</label>
                <div class="custom-dropdown list-dropdown-component">
                    <div class="dropdown-trigger" tabindex="0">
                        <span class="selected-value-display">Select a list...</span>
                        <div class="dropdown-arrow"></div>
                    </div>
                    
                    <!-- TEMPORARY LIST NAMES -->
                    <div class="dropdown-menu">
                        <div class="dropdown-options-list">
                            <button class="dropdown-option create-action-btn" data-value="create-new">
                                <span class="circle-plus-blue"></span>
                                Create List
                            </button>
                            <button class="dropdown-option" data-value="wishlist">Wishlist</button>
                            <button class="dropdown-option" data-value="shopping">Shopping</button>
                            <button class="dropdown-option" data-value="favorites">Favorites</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SELECT PRODUCTS WORKSPACE SECTION -->
            <div class="form-group">
                <div class="collect-header-row">
                    <label class="form-label">Collect <span class="blue-plus">+</span></label>
                    <!-- Segmented Mode Controller -->
                    <div class="selection-mode-toggle" id="modeToggleContainer">
                        <button class="mode-btn active" id="modeSingleBtn" title="Single Select">Single</button>
                        <button class="mode-btn" id="modeMultiBtn" title="Multi Select">Multi</button>
                    </div>
                </div>
                <div id="products-container" class="products-dotted-container">
                    <div class="add-product-tile" id="addProductBtn">
                        <span class="circle-plus-blue"></span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Footer Area -->
        <div class="sidebar-footer">
            <button class="add-to-list-btn" id="addToListBtn">
                <span class="btn-circle-plus"></span>
                <span>Add to List</span>
            </button>
        </div>

    </div>

    <script src="util.js"></script>
    <script src="app.js"></script>
</body>
</html>

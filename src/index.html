<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decidio Unified Workspace</title>
    <link rel="stylesheet" href="style.css">
    <!-- After style.css on purpose: decidio-theme.css matches the auth screen to
         the iOS app's LoginView, overriding that file's rules without editing it. -->
    <link rel="stylesheet" href="decidio-theme.css">
</head>
<body>
    <!-- Main Sidebar Panel -->
    <div class="decidio-sidebar is-collapsed" id="decidioSidebarPanel">

        <!-- Header Section (shared by both views) -->
        <!-- Three-part row, same shape as MyCollectionsHeader: back control
             hard left, wordmark centred, menu button right. -->
        <div class="sidebar-header">
            <button class="sidebar-minimize" id="sidebarMinimizeBtn"
                    aria-label="Back" title="Back">
                <!-- Two glyphs, one control. At the top level there is nothing
                     behind My Collections, so it minimises and shows a minus;
                     on every screen reached from there it goes back one level
                     and shows the arrow. Swapped by .is-titled, which is set
                     exactly when a screen title has replaced the wordmark. -->
                <svg class="icon-minimize" viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="4" y1="12" x2="20" y2="12"/>
                </svg>
                <svg class="icon-back" viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="21" y1="12" x2="4" y2="12"/>
                    <polyline points="11,5 4,12 11,19"/>
                </svg>
            </button>
            <div class="brand-logo">My Collections<span class="blue-dot">.</span></div>
            <!-- Replaces the wordmark while a list is being made, as the
                 keynote's New Collection screen does. Keeps the blue period,
                 which is the mark the header carries either way. -->
            <div class="header-title" id="headerTitle" hidden>New Collection<span class="blue-dot">.</span></div>
            <button class="sidebar-menu-btn" id="sidebarMenuBtn"
                    aria-label="Menu" title="Menu"
                    aria-expanded="false" aria-controls="panelMenu">
                <!-- line.3.horizontal, swapping to xmark while the menu is open -->
                <svg class="icon-menu" viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
                <!-- Drawn to the hamburger's right edge (x=21) so the two
                     share an outside line and nothing jumps on the swap. -->
                <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="5" y1="5" x2="21" y2="21"/>
                    <line x1="21" y1="5" x2="5" y2="21"/>
                </svg>
            </button>
        </div>

        <!-- ==================================================================
             AUTH VIEW
             ================================================================== -->
        <div class="auth-view" id="authView">
            <div class="auth-inner">
                <!-- The wordmark that sat here is gone: the headline below already
                     says "Decidio", so the two stacked as the brand name twice in
                     a row. The headline carries the accent period instead. -->
                <h1 class="auth-heading">Welcome
to Decidio<span class="blue-dot">.</span></h1>

                <!-- Invite gate, signup only. See INVITE_CODES in app.js — the
                     codes are checked in the browser, so this is an onboarding
                     flow for a closed beta, NOT a security control. -->
                <input type="text" class="auth-input auth-signup-only" id="authInvite"
                       placeholder="Invitation code" autocomplete="off" spellcheck="false">

                <input type="email" class="auth-input" id="authEmail"
                       placeholder="Email" autocomplete="email" spellcheck="false">

                <input type="password" class="auth-input" id="authPassword"
                       placeholder="Password" autocomplete="current-password">

                <input type="password" class="auth-input auth-signup-only" id="authConfirm"
                       placeholder="Confirm password" autocomplete="new-password">

                <!-- Shown when the code is rejected. Everything else in the form
                     is hidden at that point (see .is-waitlist), leaving just the
                     email field above and this — one thing to do, not a form with
                     a message bolted onto it. -->
                <div class="auth-waitlist" id="authWaitlist">
                    <div class="auth-waitlist-title" id="authWaitlistTitle">Decidio is invite only</div>
                    <div class="auth-waitlist-body" id="authWaitlistBody">Leave your email and we'll send you a code when a place opens up.</div>
                    <button class="auth-waitlist-btn" id="authWaitlistBtn">Join the waiting list</button>
                    <button class="auth-waitlist-back" id="authWaitlistBack">I have a code</button>
                </div>

                <!-- Below the fields, above the button — the order LoginView
                     uses. It sat above the fields here before. -->
                <div class="auth-error" id="authError"></div>

                <button class="auth-submit-btn" id="authSubmitBtn">Sign in</button>

                <!-- <button class="auth-link-btn auth-login-only" id="authForgotBtn">Forgot your password?</button> -->

                <div class="auth-divider"><span>or</span></div>

                <button class="auth-social-btn" id="authGoogleBtn">
                    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>

                <button class="auth-social-btn" id="authAppleBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    <span>Continue with Apple</span>
                </button>

                <div class="auth-footer">
                    <span id="authSwitchLabel">No account?</span>
                    <button class="auth-switch-btn" id="authSwitchBtn">Sign up</button>
                </div>

                <!-- Signup only, at the very bottom: the thing to do INSTEAD of
                     signing up, for anyone without a code. -->
                <button class="auth-waitlist-link auth-signup-only" id="authJoinWaitlistBtn">
                    Sign up for the waiting list
                </button>

            </div>
        </div>

        <!-- ==================================================================
             WORKSPACE VIEW (unchanged)
             ================================================================== -->
        <div class="workspace-view" id="workspaceView">

            <!-- Menu, after HomeOverlayMenuItems. Covers the workspace while
                 open; the header's hamburger (now an X) closes it. -->
            <div class="panel-menu" id="panelMenu" hidden>
                <div class="panel-menu-title">Menu</div>
                <!-- The app's Aero / Twilight switch: names the mode it will
                     switch TO, with a sun or moon, as the app's menu does. -->
                <button class="panel-menu-item" id="appearanceToggle">
                    <svg class="panel-menu-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4.2" stroke="none"/>
                        <line x1="12" y1="1.8" x2="12" y2="4.2"/>
                        <line x1="12" y1="19.8" x2="12" y2="22.2"/>
                        <line x1="1.8" y1="12" x2="4.2" y2="12"/>
                        <line x1="19.8" y1="12" x2="22.2" y2="12"/>
                        <line x1="4.8" y1="4.8" x2="6.5" y2="6.5"/>
                        <line x1="17.5" y1="17.5" x2="19.2" y2="19.2"/>
                        <line x1="4.8" y1="19.2" x2="6.5" y2="17.5"/>
                        <line x1="17.5" y1="6.5" x2="19.2" y2="4.8"/>
                    </svg>
                    <svg class="panel-menu-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke="none" d="M20.6 14.6A8.6 8.6 0 0 1 9.4 3.4a8.6 8.6 0 1 0 11.2 11.2z"/>
                    </svg>
                    <span id="appearanceLabel">Switch to Aero</span>
                </button>
                <button class="panel-menu-item" id="queueOpenBtn">
                    <svg class="panel-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="5" cy="7" r="1.6" stroke="none"/>
                        <circle cx="5" cy="12" r="1.6" stroke="none"/>
                        <circle cx="5" cy="17" r="1.6" stroke="none"/>
                        <line x1="10" y1="7" x2="19" y2="7"/>
                        <line x1="10" y1="12" x2="19" y2="12"/>
                        <line x1="10" y1="17" x2="19" y2="17"/>
                    </svg>
                    <span>Collected Items<span class="panel-menu-count" id="queueCount"></span></span>
                </button>
                <button class="panel-menu-item" id="notesOpenBtn">
                    <svg class="panel-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke="none" d="M5 3.5h14v17H5z" opacity="0"/>
                        <line x1="6" y1="6.5" x2="18" y2="6.5"/>
                        <line x1="6" y1="11" x2="18" y2="11"/>
                        <line x1="6" y1="15.5" x2="13" y2="15.5"/>
                    </svg>
                    <span>Notes</span>
                </button>
            </div>

            <!-- Notes, after the app's New Collection screen: the list name in
                 Decidio orange, then labelled sections over it. Covers the
                 workspace the way panel-menu does; the footer's check closes
                 it. Each field saves as it is typed (debounced) rather than
                 waiting for a close or a backgrounding. -->
            <div class="notes-view" id="notesView" hidden>
                <!-- The name is typed here, not on a prompt before this screen:
                     naming a list and saying what it is for are one step. Read
                     only when an existing list's notes are being edited. -->
                <input type="text" class="notes-title" id="notesTitle"
                       placeholder="Name your list" autocomplete="off" spellcheck="false">
                <div class="notes-section">
                    <label class="notes-label" for="notesDescription">Description.</label>
                    <textarea class="notes-field" id="notesDescription" rows="1"
                              placeholder="What is this collection for?"
                              spellcheck="false"></textarea>
                </div>
                <!-- Preferences is not prose about the list: it is the criteria
                     used later to order the list and to look for new things
                     like what is already in it. The placeholder asks for that
                     specifically, since a description written here is of no
                     use downstream. -->
                <div class="notes-section">
                    <label class="notes-label" for="notesPreferences">Preferences.</label>
                    <textarea class="notes-field" id="notesPreferences" rows="1"
                              placeholder="What matters most when you choose?"
                              spellcheck="false"></textarea>
                </div>
                <div class="notes-saved" id="notesSaved" aria-live="polite"></div>
            </div>

            <!-- Queue: what has been collected into this list but not yet
                 named. After the app's own scan queue (ARSessionStore), laid
                 out like the Specs screen — a heading, then rows of label and
                 value separated by rules, with Decidio Purple carrying the
                 state. -->
            <div class="queue-view" id="queueView" hidden>
                <!-- The header already says Queue; this names the list it is
                     the queue for, as the notes screen does. -->
                <div class="queue-title" id="queueTitle"></div>
                <div class="queue-list" id="queueList"></div>
                <!-- No empty-state line here on purpose: an empty Collected
                     Items page is self-evident, and a sentence explaining it
                     read as a notice about something being wrong. -->
            </div>

            <!-- Main Body Content -->
            <div class="sidebar-body">

                <!-- My Collections: the lists themselves, set down the middle of
                     the panel, after the app's own typographic list. Tapping a
                     name selects it; the aperture below collects into it. The
                     "Collect +" heading and the aperture tile that used to sit
                     here are gone — the aperture lives in the footer now, and
                     the heading named a section that no longer exists. -->
                <div class="collections-list" id="collectionsList"></div>

                <!-- The opened list's items, and before anything is filed,
                     whatever has been collected but not yet put away. -->
                <div id="products-container" class="products-dotted-container is-view-list"></div>

                <div class="list-empty" id="listEmpty" hidden>
                    Nothing in this list yet. Use the aperture below to collect
                    from this page.
                </div>

            </div>

            <!-- Bottom Footer Area -->
            <!-- One control: the aperture, the symbol the app's Home screen uses
                 for this action. The list bar, its two rules and the plus are
                 gone — the list is chosen in the body now, so a strip naming it
                 down here was saying the same thing twice, and with the list
                 known the plus had nothing left to confirm. -->
            <div class="sidebar-footer">
                <button class="collect-btn" id="collectBtn"
                        aria-label="Collect from this page" title="Collect from this page">
                    <svg class="btn-aperture" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9.25"/>
                        <line x1="12.00" y1="7.10"  x2="21.24" y2="12.43"/>
                        <line x1="16.24" y1="9.55"  x2="16.24" y2="20.22"/>
                        <line x1="16.24" y1="14.45" x2="7.00"  y2="19.78"/>
                        <line x1="12.00" y1="16.90" x2="2.76"  y2="11.57"/>
                        <line x1="7.76"  y1="14.45" x2="7.76"  y2="3.78"/>
                        <line x1="7.76"  y1="9.55"  x2="17.00" y2="4.22"/>
                    </svg>
                </button>
                <!-- The New Collection screen ends in a check rather than a
                     plus, so the footer swaps glyphs while notes are open. -->
                <button class="notes-done-btn" id="notesDoneBtn" aria-label="Done" title="Done" hidden>
                    <svg class="btn-check-circle" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9.25"/>
                        <polyline points="7.6,12.2 10.7,15.3 16.4,8.9"/>
                    </svg>
                </button>
            </div>

        </div>

    </div>

    <script src="util.js"></script>
    <script src="app.js"></script>
</body>
</html>
